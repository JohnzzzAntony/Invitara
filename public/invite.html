<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're invited</title>
  <meta name="description" content="You have been invited — see the details and RSVP." />
  <!-- Guests' invitations are private: never indexed. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#faf7f2" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23652901'/%3E%3Ctext x='16' y='21.5' font-family='Georgia,serif' font-size='15' fill='white' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />



<link rel="stylesheet" href="css/collection.css"/>
<link rel="stylesheet" href="css/studio.css"/>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Great+Vibes&family=Jost:wght@300;400;500;600;700;800&family=Parisienne&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,500&display=swap"><link rel="stylesheet" href="css/premium.css"><link rel="stylesheet" href="css/platform.css"><link rel="stylesheet" href="css/platform-app.css"><link rel="stylesheet" href="css/editions.css"><link rel="stylesheet" href="css/refinement.css"></head>
<body class="invite-body" style="margin:0">
  <!-- The published invitation renders here, full-bleed. -->
  <div id="invite-loading" class="invitation-loading" role="status"><span>Opening your invitation…</span><div class="loading-card" aria-hidden="true"></div></div><div id="invite-root"></div>

  <div class="invite-missing" id="invite-missing" hidden>
    <div class="container">
      <h1>This invitation could not be opened</h1>
      <p>
        The link may be incomplete — invitation links are long, so they can get
        cut short when copied out of a message. Ask whoever invited you to send
        the full link again.
      </p>
      <div class="invite-recovery-actions"><button id="invite-retry" type="button">Try again</button><a href="index.html">About Invitara →</a></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/templates.js"></script>
  <script src="js/mu.js"></script>
  <script src="js/layouts/collection.js"></script><script src="js/platform-catalog.js"></script><script src="js/layouts/platform.js"></script><script src="js/editions-catalog.js"></script><script src="js/editions-layout.js"></script>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="js/experience.js"></script><script src="js/platform-experiences.js"></script><script src="js/editions-experience.js"></script>
  <script src="js/commerce.js"></script>
<script src="js/api.js"></script>
  <script src="js/invite-live.js"></script>
</body>
</html>
